name: Generate Profile Graphs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: dheerajmishra75
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate Activity Graph - Dark
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: dheerajmishra75
          options: theme=react-dark&hide_border=true&area=true&custom_title=Contribution%20Activity
          output_path: dist/activity-graph-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Activity Graph - Light
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: dheerajmishra75
          options: theme=github-compact&hide_border=true&area=true&custom_title=Contribution%20Activity
          output_path: dist/activity-graph-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Profile Graphs
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
